# [FLEET-ARCHITECT] Standardized Polyglot Dependabot
# Sync-ID: 2026-05-11-GLOBAL-001
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/integration"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
