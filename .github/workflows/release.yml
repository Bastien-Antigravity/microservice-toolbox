# [FLEET-ARCHITECT] Fleet Polyglot Release
# Sync-ID: 2026-05-11-GLOBAL-001
name: Fleet Release

on:
  push:
    tags: ['v*']

jobs:
  build_artifacts:
    name: Build Artifacts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Shared Libraries
        shell: bash
        run: |
          if grep -q "^build-all:" Makefile; then
            make build-all
          elif grep -q "^build:" Makefile; then
            make build
          fi

      - name: Package Python SDK
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ ! -f VERSION.txt ]; then
            echo "ERROR: VERSION.txt is missing at repository root" >&2
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION.txt)
          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION.txt is empty" >&2
            exit 1
          fi
          if [ ! -f python/pyproject.toml ]; then
            echo "ERROR: python/pyproject.toml is missing" >&2
            exit 1
          fi
          if ! grep -Eq "^version[[:space:]]*=[[:space:]]*\"${VERSION}\"" python/pyproject.toml; then
            echo "ERROR: python/pyproject.toml version does not match VERSION.txt (${VERSION})" >&2
            exit 1
          fi
          echo "--- Packaging Python SDK v${VERSION} in python/ ---"
          cd python
          python -m pip install --upgrade pip build setuptools wheel
          python -m build --wheel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            **/dist/*.whl
            **/dist/*.tar.gz
            **/lib*/*.so
            **/lib*/*.dll
            **/lib*/*.dylib

  release:
    name: Create GitHub Release
    needs: build_artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
