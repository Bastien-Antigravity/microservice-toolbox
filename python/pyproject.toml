[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microservice-toolbox"
version = "0.0.1"
description = "Cross-language utilities for microservice development"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "grpcio>=1.80.0",
    "msgpack>=1.0.0",
    "cryptography>=42.0.0",
    "nats-py>=2.7.0",
]

[project.optional-dependencies]
ecosystem = [
    "unilog @ git+https://github.com/Bastien-Antigravity/universal-logger.git@develop#subdirectory=unilog/python",
    "distconf @ git+https://github.com/Bastien-Antigravity/distributed-config.git@develop#subdirectory=distconf/python",
    "safe-socket @ git+https://github.com/Bastien-Antigravity/safe-socket.git@develop#subdirectory=safesock/python",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
